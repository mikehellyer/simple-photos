[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-photos"
version = "0.10.0"
description = "A simple photo manager"
authors = [{ name = "Mike Hellyer" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "platformdirs",
    "certifi",
    "Pillow",
    "pillow-heif",
    "numpy",
    # 4.x: OpenCV 5 dropped the bundled face-detector files Auto-Rotate uses
    "opencv-python-headless>=4.10,<5",
    "rawpy",
]

[project.scripts]
simple-photos = "simple_photos.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simple_photos.gui" = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
